{% extends "base.html" %}
{% block title %}Plan by Mood{% endblock %}
{% block content %}
  <h1>What's the mood?</h1>
  <form method="POST" action="{{ url_for('plan_by_sentiment') }}" class="plan-form">
    <label>Mood / sentiment
      <select name="sentiment" required>
        {% for s in sentiments %}
          <option value="{{ s }}">{{ s|capitalize }}</option>
        {% endfor %}
      </select>
    </label>

    <label>Budget
      <select name="budget" required>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </label>

    <label>Number of people
      <input type="number" name="people" min="1" value="2" required>
    </label>

    <label>Nights
      <input type="number" name="nights" min="1" value="3" required>
    </label>

    <button type="submit" class="btn-primary">Show matching places</button>
  </form>
{% endblock %}
